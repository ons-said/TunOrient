[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./app.db
# this is the path to the database file
# you can change it to your preferred database URL

# Logging configuration
log_file = alembic.log
log_level = INFO
# you can change the log level to DEBUG for more detailed logs

# Migration settings
# Uncomment the following line to enable autogenerate feature
# autogenerate = true

# Additional settings can be added here as needed